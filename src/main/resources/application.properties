# 随机本地端口（避免端口冲突）
server.port=0

# ---- 审计流水线配置（audit.*）----
# 本地留存目录（ledger.log / outbox.log / holds.log / keys/）
audit.storage-dir=data/audit
# occurredAt 允许超过当前时间的毫秒数，超出判为 SUSPICIOUS_TIMESTAMP
audit.max-future-skew-ms=60000
# 保留天数：事件时间早于 now-N 天且未命中法律保留才会被清除
audit.retention-days=90
# 是否在进程启动后自动派发转发与重试（测试中可关闭）
audit.auto-forward=false
# 转发目标地址（留空则所有转发判为 NOT_CONFIGURED 不可重试，便于本地离线复现）
audit.forward-url=
audit.forward-timeout-ms=5000
# 重试：最大尝试次数、初始退避、退避上限、派发轮询间隔、INFLIGHT 卡死回收时间
audit.retry-max-attempts=10
audit.retry-initial-delay-ms=200
audit.retry-max-delay-ms=30000
audit.dispatch-interval-ms=500
audit.inflight-recover-ms=30000
