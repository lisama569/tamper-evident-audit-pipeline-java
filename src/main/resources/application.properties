server.port=0

# ===== 审计流水线配置 =====
# 本地留存根目录
audit.storage-dir=${AUDIT_STORAGE_DIR:data/audit}
# HMAC 密钥（生产请通过环境变量注入；留空使用本地开发默认值）
audit.hmac-secret=${AUDIT_HMAC_SECRET:local-dev-hmac-secret-change-me}
# 事件时间允许的未来偏移（秒）
audit.max-future-clock-skew-seconds=300
# 允许的最早事件时间（epoch 秒，0=1970-01-01Z）
audit.min-event-time-epoch-seconds=0
# 默认保留天数
audit.default-retention-days=90
# 法律保留优先（始终为 true）
audit.legal-hold-precedence=true

# 转发目标 URL（留空=仅日志的本地 sink）
audit.forwarder-url=${AUDIT_FORWARDER_URL:}
audit.forward-connect-timeout-ms=2000
audit.forward-read-timeout-ms=5000
# 重试语义
audit.retry-initial-backoff-ms=500
audit.retry-max-backoff-ms=30000
audit.retry-max-attempts=5
audit.retry-on-startup=true
